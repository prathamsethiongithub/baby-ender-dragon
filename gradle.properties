# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric Properties
# Resolved from the official fabric-example-mod 26.2 branch and FabricMC maven metadata
# on 2026-10-04. See research/environment-lock.json.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
version=0.1.0
group=com.babyenderdragon

# Dependencies
fabric_api_version=0.161.0+26.2

# Mappings
# Loom 1.18 runs non-obfuscated by default; Mojang official mappings are the effective
# and only mapping set for this toolchain. Declared here so the mission environment lock
# can resolve and pin the value. Do NOT also call loom.officialMojangMappings() in
# build.gradle -- Loom 1.18.2 rejects that with
# "Cannot use Mojang mappings in a non-obfuscated environment".
mappings=MOJANG_OFFICIAL