plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'baby-ender-dragon'
}

version = project.version
group = project.group

repositories {
	maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

loom {
	fabricApi {
		// Creates the `gametest` source set and registers run config `clientGameTest`
		// -> Gradle task `runClientGameTest`.
		configureTests {
			createSourceSet = true
			enableGameTests = true
			enableClientGameTests = true
			// Without this the embedded dedicated server refuses to boot
			// ("You need to agree to the EULA") and createServer() times out.
			eula = true
		}
	}
}